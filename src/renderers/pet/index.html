<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Desktop Pet</title>
  </head>
  <body>
    <main id="pet-shell">
      <section id="pet-root" aria-label="Desktop pet"></section>

      <section id="work-overlay" aria-label="Active activity" hidden>
        <output id="work-countdown" aria-live="polite"></output>
        <button id="cancel-work-button" type="button">Cancel</button>
      </section>
      <aside id="burnout-banner" class="burnout-banner" role="status" hidden></aside>

      <section
        id="pet-stats-overlay"
        aria-label="Pet menu"
        hidden
      >
        <div class="overlay-content">
          <div class="overlay-panel" data-overlay-panel="status">
            <div class="growth-summary">
              <div><strong id="personal-level">Level 1</strong><span id="general-xp">0 General XP</span></div>
              <progress id="general-xp-progress" max="50" value="0" aria-label="Personal level progress"></progress>
            </div>
            <div class="needs-grid" aria-label="Pet needs">
              <label><span>Health</span><progress id="health" max="100"></progress></label>
              <label><span>Food</span><progress id="hunger" max="100"></progress></label>
              <label><span>Water</span><progress id="thirst" max="100"></progress></label>
              <label><span>Mood</span><progress id="mood" max="100"></progress></label>
              <label><span>Energy</span><progress id="energy" max="100"></progress></label>
              <label><span>Affection</span><progress id="affection" max="100"></progress></label>
              <label><span>Bond</span><progress id="bond" max="100"></progress></label>
            </div>
            <div class="care-bands"><span>Hygiene: <strong id="hygiene-status"></strong></span><span>Stress: <strong id="stress-status"></strong></span></div>
            <div id="illness-status" class="illness-status" hidden></div>

            <div class="control-row">
              <button id="home-button" type="button">Home</button>
              <button id="work-menu-button" type="button">Work</button>
              <button id="careers-menu-button" type="button">Careers</button>
              <button id="shop-window-button" type="button">Shop</button>
              <button id="settings-window-button" type="button">Settings</button>
              <button id="characters-window-button" type="button">Characters</button>
              <button id="integrations-window-button" type="button">Integrations</button>
            </div>
            <div class="stat-line">
              <span id="wallet" aria-label="Wallet"></span>
              <span id="mastery" aria-label="Mastery"></span>
              <span id="knowledge" aria-label="General Knowledge"></span>
            </div>
            <output id="status-text" aria-live="polite"></output>
            <div id="condition-status" class="condition-status" hidden></div>
          </div>

          <div class="overlay-panel" data-overlay-panel="interact" hidden>
            <div class="care-actions">
              <button id="pet-button" type="button">Pet</button>
              <button id="talk-button" type="button">Talk</button>
              <button id="play-button" type="button">Play</button>
              <button id="walk-button" type="button">Walk</button>
              <button id="rest-button" type="button">Rest</button>
              <button data-use-item="core:basic-meal" type="button">Feed</button>
              <button data-use-item="core:water" type="button">Drink</button>
              <button data-use-item="core:soap" type="button">Clean</button>
              <button id="comfort-button" type="button">Comfort</button>
              <button data-use-item="core:medicine" type="button">Medicine</button>
            </div>
            <p class="care-help">Pet, Talk, Comfort, and gifts remain available during major activities.</p>
          </div>

          <div class="overlay-panel activity-panel" data-overlay-panel="activity" hidden>
            <ol id="activity-list" aria-live="polite"></ol>
            <p id="activity-empty" class="empty-state">No recorded activity yet.</p>
            <button id="load-older-activity" type="button" hidden>Load older</button>
            <output id="activity-error" class="overlay-error" aria-live="polite"></output>
          </div>
          <output id="care-error" class="overlay-error" aria-live="polite"></output>
        </div>
        <nav class="overlay-tabs" aria-label="Pet menu tabs">
          <button class="active" data-overlay-tab="status" type="button">Status</button>
          <button data-overlay-tab="interact" type="button">Interact</button>
          <button data-overlay-tab="activity" type="button">Activity</button>
        </nav>
      </section>
    </main>
    <script type="module" src="/index.ts"></script>
  </body>
</html>
